name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version tag
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - run: go test -race ./...
      - run: go vet ./...
  binaries:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist staging
          name="mirulesets_${TAG}_${GOOS}_${GOARCH}"
          executable=mirulesets
          if [ "$GOOS" = windows ]; then executable=mirulesets.exe; fi
          go build -trimpath -ldflags="-s -w -X github.com/blagodaren/mirulesets/internal/version.Version=${TAG#v}" -o "staging/$executable" ./cmd/mirulesets
          cp README.md UI_KIT.md .env.example compose*.yml Dockerfile staging/
          cp -R docs deploy staging/
          mkdir -p staging/web staging/internal/rules
          cp web/favicon.svg staging/web/
          cp -R web/licenses staging/web/
          cp internal/rules/README.md staging/internal/rules/
          if [ "$GOOS" = windows ]; then
            (cd staging && zip -qr "../dist/$name.zip" .)
          else
            tar -C staging -czf "dist/$name.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  image:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
      - name: Application version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Checksums and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes="docs/releases/${TAG#v}.md"
            if [ -f "$notes" ]; then
              gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
