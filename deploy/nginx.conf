# Replace rules.example.com and certificate paths with your values.
# Assumes nginx runs on the VPS host; app is bound to 127.0.0.1:8080.
# Set MI_TRUSTED_PROXIES to the actual direct peer seen by the app:
# 127.0.0.1/32,::1/128 for a native app, or Docker bridge gateway /32 for Compose.
server {
    listen 80;
    server_name rules.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name rules.example.com;
    ssl_certificate /etc/letsencrypt/live/rules.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rules.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
